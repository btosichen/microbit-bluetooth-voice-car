<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#8d72e8"><title>小輪輪出發！藍牙麥克納姆輪遙控器</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><p>MICRO:BIT V2 · SUPER:BIT 2.0</p><h1>小輪輪出發！<span>🛼</span></h1><div>藍牙麥克納姆輪遙控器</div></header>
<section class="card connection"><div><i id="dot"></i><span id="status">尚未連線</span></div><button id="connect">連接 micro:bit</button></section>
<section class="card controller"><div class="section-heading"><h2>方向控制</h2><span>按住行駛 · 放開停止</span></div><div class="controller-layout"><div class="drive-grid" aria-label="十方向遙控器">
<button class="control soft" data-command="Q" data-label="左上斜" disabled><b>↖</b><span>左上斜</span></button><button class="control forward" data-command="W" data-label="前進" disabled><b>↑</b><span>前進</span><small>W</small></button><button class="control soft" data-command="E" data-label="右上斜" disabled><b>↗</b><span>右上斜</span></button>
<button class="control strafe" data-command="A" data-label="向左平移" disabled><b>←</b><span>向左平移</span><small>A</small></button><div class="wheel-face">🐾<small>按住<br>出發</small></div><button class="control strafe" data-command="D" data-label="向右平移" disabled><b>→</b><span>向右平移</span><small>D</small></button>
<button class="control soft" data-command="Z" data-label="左下斜" disabled><b>↙</b><span>左下斜</span></button><button class="control backward" data-command="X" data-label="後退" disabled><b>↓</b><span>後退</span><small>X</small></button><button class="control soft" data-command="C" data-label="右下斜" disabled><b>↘</b><span>右下斜</span></button>
</div><div class="turn-controls"><p>原地轉向</p><button class="turn left" data-command="S" data-label="左轉" disabled><b>↺</b><span>左轉</span><small>S</small></button><button class="turn right" data-command="J" data-label="右轉" disabled><b>↻</b><span>右轉</span><small>J</small></button></div></div>
<button id="stop" class="emergency" type="button">■ 立即停止</button></section>
<section class="card help"><h2>操作小提醒</h2><p>連線後，<b>按住</b>一個方向按鈕讓小車行駛，<b>放開</b>就會停止；鍵盤也可使用 W、A、S、D、Z、X、C、Q、E、J。</p><p>先讓輪子離地測試方向，確認安全後再放到地面操作。</p></section>
</main><script src="app.js"></script></body></html>
